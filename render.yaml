services:
  - type: web
    name: cloud-utility-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: MONGO_URI
        sync: false
      - key: BASE_URL
        sync: false
      - key: PORT
        value: 10000
      - key: WEB_CONCURRENCY
        value: 1
